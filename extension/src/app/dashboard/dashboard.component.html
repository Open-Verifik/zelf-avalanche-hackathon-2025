                            <clipPath id="clip0_131_2103">
                                <rect width="16" height="16" fill="white" transform="matrix(1 0 0 -1 0 16)" />

            </div>
        </div>
    </div>

    <nav class="dashboard__nav">
        <div class="dashboard__nav-item" [class.dashboard__nav-item--active]="activeTab === 'start'" (click)="navigateToTab('start')">
            <div class="dashboard__nav-text">Start</div>
        </div>

        <div class="dashboard__nav-item" [class.dashboard__nav-item--active]="activeTab === 'passwords'" (click)="navigateToTab('passwords')">
            <div class="dashboard__nav-text">Passwords</div>
        </div>

        <div class="dashboard__nav-item" [class.dashboard__nav-item--active]="activeTab === 'notes'" (click)="navigateToTab('notes')">
            <div class="dashboard__nav-text">Notes</div>
        </div>

        <div class="dashboard__nav-item" [class.dashboard__nav-item--active]="activeTab === 'payment-cards'" (click)="navigateToTab('payment-cards')">
            <div class="dashboard__nav-text">Payment Cards</div>
        </div>

        <div class="dashboard__nav-item" [class.dashboard__nav-item--active]="activeTab === 'billing'" (click)="navigateToTab('billing')">
            <div class="dashboard__nav-text">Subscription</div>
        </div>
    </nav>

    <main class="dashboard__content">
        <router-outlet></router-outlet>
    </main>
</div>
