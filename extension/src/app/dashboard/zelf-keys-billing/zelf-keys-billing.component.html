<div class="billing-container">
	<div class="billing-header">
		<h1 class="billing-title">Choose Your Plan</h1>
		<p class="billing-subtitle">Select the plan that best fits your needs</p>
	</div>

	<div class="pricing-grid">
		<div *ngFor="let plan of plans" class="pricing-card" [class.popular]="plan.isPopular" [class.current]="plan.isCurrent">
			<div class="card-header">
				<div class="plan-name">{{ plan.name }}</div>
				<div *ngIf="plan.isPopular" class="popular-badge">POPULAR</div>
			</div>

			<div class="plan-pricing">
				<div class="price">
					<span class="currency">$</span>
					<span class="amount">{{ plan.price }}</span>
					<span class="period">/{{ plan.period }}</span>
				</div>
			</div>

			<div class="plan-tagline">{{ plan.tagline }}</div>

			<div class="plan-features">
				<div *ngFor="let feature of plan.features" class="feature-item">
					<svg class="feature-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
						<path
							d="M9 12L11 14L15 10M21 12C21 16.9706 16.9706 21 12 21C7.02944 21 3 16.9706 3 12C3 7.02944 7.02944 3 12 3C16.9706 3 21 7.02944 21 12Z"
							stroke="currentColor"
							stroke-width="2"
							stroke-linecap="round"
							stroke-linejoin="round"
						/>
					</svg>
					<span class="feature-text">{{ feature }}</span>
				</div>
			</div>

			<button class="plan-button" [class]="getPlanButtonClass(plan)" [disabled]="isPlanDisabled(plan)" (click)="selectPlan(plan.id)">
				{{ getPlanButtonText(plan) }}
			</button>
		</div>
	</div>

	<div class="billing-footer">
		<div class="footer-links">
			<a href="#" class="footer-link">Have an existing plan? See billing help</a>
		</div>
		<div class="footer-links">
			<a href="#" class="footer-link">I need help with a billing issue</a>
		</div>
		<div class="footer-links">
			<a href="#" class="footer-link">Unlimited subject to fair use policy. Learn more</a>
		</div>
	</div>
</div>
