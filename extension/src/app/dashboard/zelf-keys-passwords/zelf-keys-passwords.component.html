<div class="zelf-keys-passwords">
	<div class="header">
		<h2>Passwords</h2>
		<p>Manage your secure passwords and credentials</p>
	</div>

	<div class="content">
		<!-- Loading State -->
		<div *ngIf="loading" class="loading-state">
			<div class="spinner"></div>
			<p>Loading your passwords...</p>
		</div>

		<!-- Error State -->
		<div *ngIf="error && !loading" class="error-state">
			<div class="icon">⚠️</div>
			<h3>Error loading passwords</h3>
			<p>{{ error }}</p>
			<button class="btn-secondary" (click)="onRefresh()">Try Again</button>
		</div>

		<!-- Passwords Grid -->
		<div *ngIf="!loading && !error && storedPasswords.length > 0" class="passwords-grid">
			<div class="list-header">
				<h3>{{ storedPasswords.length }} stored password{{ storedPasswords.length !== 1 ? "s" : "" }}</h3>
				<button class="btn-secondary" (click)="onRefresh()">Refresh</button>
			</div>

			<div class="password-cards">
				<app-data-card
					*ngFor="let password of storedPasswords; trackBy: trackByPassword"
					[item]="password"
					category="password"
					(cardClick)="onPasswordClick($event)"
					(launchClick)="onPasswordClick($event)"
					(optionsClick)="onPasswordClick($event)"
				>
				</app-data-card>
				<!-- Empty State - Show add password card when no passwords exist -->
				<div *ngIf="!loading && !error" class="passwords-grid">
					<div class="add-password" (click)="onAddPassword()">
						<div class="add-icon">+</div>
						<h3>Add New Password</h3>
						<p>Securely store a new password</p>
					</div>
				</div>
			</div>
		</div>
	</div>
</div>
